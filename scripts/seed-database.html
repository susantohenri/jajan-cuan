    const logEl = document.getElementById('log');
    function log(msg) {
      logEl.textContent += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    document.getElementById('seedBtn').addEventListener('click', async () => {
      const btn = document.getElementById('seedBtn');
      btn.disabled = true;
      log("Mengirim seed data ke path '/posts' di Firebase RTDB...");
      try {
        await db.ref('posts').set(SEED_PAYLOAD);
        log("✅ BERHASIL! 3 resep berhasil di-push ke node '/posts'.");
      } catch (err) {
        log(`❌ GAGAL: ${err.message}`);
        console.error(err);
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('checkBtn').addEventListener('click', async () => {
      log("Membaca node '/posts' dari RTDB...");
      try {
        const snap = await db.ref('posts').once('value');
        const data = snap.val();
        if (data) {
          log(`✅ Data ditemukan: ${Object.keys(data).length} postingan resep aktif:\n- ` + Object.keys(data).join('\n- '));
        } else {
          log("⚠️ Node '/posts' masih kosong.");
        }
      } catch (err) {
        log(`❌ Gagal membaca: ${err.message}`);
      }
    });
  </script>
</body>
